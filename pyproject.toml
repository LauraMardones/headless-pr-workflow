[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "headless-pr-workflow"
version = "0.1.0"
description = "Assistant-agnostic GitHub-centered headless PR workflow policy and automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Headless PR Workflow Contributors" }
]

[project.scripts]
hpw = "headless_pr_workflow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
