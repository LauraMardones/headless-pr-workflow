# Dispatcher workflow — autonomous story-level execution entry point
#
# 2026-08-09: touched to re-arm the schedule trigger after GitHub Actions
# stopped firing the cron for this workflow (no runs between Aug 7 07:09
# and Aug 9, despite the workflow remaining active and no config change).
#
# 2026-08-10 (issue #252): the "Run dispatcher invoke" step never wired any
# executor secret into its env:, so no dispatcher-driven /implement invocation
# could ever authenticate regardless of what was configured in repository
# Settings. The executor secrets are now explicitly referenced below.
#
# 2026-10-14 (issue #314, ADR-012): every Claude session runs Claude Code on
# the runner, signed in with CLAUDE_CODE_OAUTH_TOKEN (the PO's subscription).
# The metered Anthropic key is no longer wired in and must not be added back;
# OPENAI_API_KEY_CODEX stays for the Codex tier until #315.
#
# 2026-09-27 (issue #257): ready_for_refinement de-duplication state now
# survives ephemeral runners. .dispatcher-state/ is restored from
# actions/cache before the poll and saved under a unique per-run key right
# after it (independent of whether an issue is ready for implementation).
# Only default-branch runs write it, because caches are ref-scoped; a manual
# run on another ref polls with --dry-run against the default-branch snapshot.
# Workflow-level concurrency serializes scheduled and manual runs so two runs
# never read the same snapshot and race to write it. Interim until #259.
#
# 2026-10-14 (issue #295): notifications that need PO action are queued in the
# same .dispatcher-state/ by dispatcher-invoke.sh and sent, retried and bounded
# by the "Retry actionable Slack notifications" step, which runs every cycle
# even when the invoke step is skipped. The state save moved after that step.
#
# 2026-10-13 (issue #293): the invoke step also runs when the poll reports a
# story "In merge" or "In implementation", so the dispatcher can resume a story
# after the Codex review loop answered. With no story ready for implementation
# it runs dispatcher-invoke.sh with --resume.
#
# Prototype divergences:
# D1: dispatcher-poll.sh does not yet exist on main (story #170 is in review).
#     This workflow references the script by path; the run step will fail gracefully
#     if the script is absent until #170 lands. No guard is added here — the log
#     output of a missing script is diagnostic and sufficient.

name: Dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# One dispatcher run at a time per repository: scheduled and manual runs share
# the same group, and queued runs wait instead of cancelling an in-progress
# run, so refinement-notification state is never written by two runs at once.
concurrency:
  group: dispatcher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — check DISPATCHER_ENABLED
        id: guard
        env:
          DISPATCHER_ENABLED: ${{ vars.DISPATCHER_ENABLED }}
        run: |
          if [ "$DISPATCHER_ENABLED" != "true" ]; then
            echo "Dispatcher disabled"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Actions caches are scoped by ref: a cache saved on a non-default ref is
      # invisible to the scheduled run on the default branch. Only default-branch
      # runs (every scheduled run, and manual runs dispatched on that branch)
      # may send refinement notifications and save state; a manual run on any
      # other ref reads the default-branch snapshot and polls with --dry-run.
      - name: Resolve notification state scope
        if: steps.guard.outputs.enabled == 'true'
        id: scope
        env:
          STATE_WRITER: ${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          echo "state_writer=$STATE_WRITER" >> "$GITHUB_OUTPUT"
          if [ "$STATE_WRITER" != "true" ]; then
            echo "Non-default ref ${GITHUB_REF}: poll runs with --dry-run; refinement notification state is read-only"
          fi

      # Restores the newest snapshot: restore-keys prefix matches pick the most
      # recently created cache. A miss is not an error; dispatcher-poll.sh
      # starts from empty state.
      - name: Restore refinement notification state
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .dispatcher-state
          key: dispatcher-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dispatcher-state-

      - name: Run dispatcher poll
        if: steps.guard.outputs.enabled == 'true'
        id: poll
        run: |
          POLL_ARGS=(--repo "${{ github.repository }}")
          if [ "${{ steps.scope.outputs.state_writer }}" != "true" ]; then
            POLL_ARGS+=(--dry-run)
          fi
          POLL_JSON=$(bash scripts/dispatcher-poll.sh "${POLL_ARGS[@]}")
          NEXT_ISSUE=$(echo "$POLL_JSON" | jq -r '.ready_for_implementation[0].number // empty')
          echo "issue_number=$NEXT_ISSUE" >> "$GITHUB_OUTPUT"
          # Issue #293: a story "In merge", or "In implementation" with a fix
          # round due, is resumed by dispatcher-invoke.sh even when no story is
          # ready for implementation.
          RESUMABLE=$(echo "$POLL_JSON" | jq -r '((.in_merge // []) + (.in_implementation // [])) | length > 0')
          echo "resumable=$RESUMABLE" >> "$GITHUB_OUTPUT"

      - name: Set cache date
        if: steps.guard.outputs.enabled == 'true'
        run: echo "TODAY=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore budget state cache
        if: steps.guard.outputs.enabled == 'true' && (steps.poll.outputs.issue_number != '' || steps.poll.outputs.resumable == 'true')
        uses: actions/cache/restore@v4
        with:
          path: |
            .dispatcher-budget
            .dispatcher-allowance
          key: budget-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            budget-${{ env.TODAY }}-

      # Issue #317: the subscription allowance check (scripts/dispatcher-allowance.sh)
      # runs one Claude Code turn before each session start, and every Claude
      # session runs on this same install (issue #314). Pinned so the
      # undocumented rate_limit_event shape, the session flags and what the
      # model aliases mean change only on a deliberate bump; see
      # docs/DISPATCHER-CONFIG.md → "Subscription allowance and reserve".
      - name: Install Claude Code
        if: steps.guard.outputs.enabled == 'true' && (steps.poll.outputs.issue_number != '' || steps.poll.outputs.resumable == 'true')
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Run dispatcher invoke
        if: steps.guard.outputs.enabled == 'true' && (steps.poll.outputs.issue_number != '' || steps.poll.outputs.resumable == 'true')
        id: invoke
        env:
          BUDGET_DAILY_HAIKU: ${{ vars.BUDGET_DAILY_HAIKU }}
          BUDGET_DAILY_SONNET: ${{ vars.BUDGET_DAILY_SONNET }}
          BUDGET_DAILY_OPUS: ${{ vars.BUDGET_DAILY_OPUS }}
          BUDGET_DAILY_CODEX: ${{ vars.BUDGET_DAILY_CODEX }}
          OPENAI_API_KEY_CODEX: ${{ secrets.OPENAI_API_KEY_CODEX }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESERVE_FIVE_HOUR_PERCENT: ${{ vars.RESERVE_FIVE_HOUR_PERCENT }}
          RESERVE_WEEKLY_PERCENT: ${{ vars.RESERVE_WEEKLY_PERCENT }}
          CODEX_FIX_ROUND_MAX: ${{ vars.CODEX_FIX_ROUND_MAX }}
          NEXT_ISSUE: ${{ steps.poll.outputs.issue_number }}
        run: |
          # Resumable work is handled first in both forms; --resume is the run
          # with no story ready for implementation (issue #293).
          if [ -n "$NEXT_ISSUE" ]; then
            bash scripts/dispatcher-invoke.sh --repo "${{ github.repository }}" --issue "$NEXT_ISSUE"
          else
            bash scripts/dispatcher-invoke.sh --repo "${{ github.repository }}" --resume
          fi

      - name: Save budget state cache
        if: steps.guard.outputs.enabled == 'true' && (steps.poll.outputs.issue_number != '' || steps.poll.outputs.resumable == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            .dispatcher-budget
            .dispatcher-allowance
          key: budget-${{ env.TODAY }}-${{ github.run_id }}

      # Issue #295: delivers and retries the Slack notifications that need PO
      # action (decision blocker, Feature closure, Epic closure). It runs on
      # every enabled cycle, including when no story is ready or resumable and
      # the invoke step is skipped, and even after the invoke step failed, but
      # not after a failed poll: the state is saved only after a successful poll,
      # so a delivery recorded then would be lost and sent again. A
      # failed delivery does not fail the step until it has failed for 3 cycles
      # in a row, then the run is red. A non-default ref only reports what it
      # would send (--dry-run), like the poll.
      - name: Retry actionable Slack notifications
        if: ${{ !cancelled() && steps.poll.outcome == 'success' && steps.guard.outputs.enabled == 'true' }}
        run: |
          RETRY_ARGS=(run --repo "${{ github.repository }}")
          if [ "${{ steps.scope.outputs.state_writer }}" != "true" ]; then
            RETRY_ARGS+=(--dry-run)
          fi
          bash scripts/dispatcher-notify-retry.sh "${RETRY_ARGS[@]}"

      # Saved on every enabled default-branch run, after the invoke and retry
      # steps (issue #295), so state they changed survives even when one of them
      # fails. Not only when an issue is ready for implementation. Cache entries
      # are immutable, so each run writes a new unique key that the next run's
      # prefix restore picks up.
      - name: Save refinement notification state
        if: ${{ !cancelled() && steps.poll.outcome == 'success' && steps.guard.outputs.enabled == 'true' && steps.scope.outputs.state_writer == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .dispatcher-state
          key: dispatcher-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Notify budget cap reached
        if: steps.guard.outputs.enabled == 'true' && steps.invoke.outputs.all_budget_blocked == 'true'
        env:
          BUDGET_DAILY_HAIKU: ${{ vars.BUDGET_DAILY_HAIKU }}
          BUDGET_DAILY_SONNET: ${{ vars.BUDGET_DAILY_SONNET }}
          BUDGET_DAILY_OPUS: ${{ vars.BUDGET_DAILY_OPUS }}
          BUDGET_DAILY_CODEX: ${{ vars.BUDGET_DAILY_CODEX }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "[BUDGET NOTIFY] Sending budget_cap_reached Slack notification"
          remaining_haiku=$(bash scripts/dispatcher-budget.sh check haiku || true)
          remaining_sonnet=$(bash scripts/dispatcher-budget.sh check sonnet || true)
          remaining_opus=$(bash scripts/dispatcher-budget.sh check opus || true)
          remaining_codex=$(bash scripts/dispatcher-budget.sh check codex || true)
          context_json=$(jq -n --arg remaining_haiku "$remaining_haiku" --arg remaining_sonnet "$remaining_sonnet" --arg remaining_opus "$remaining_opus" --arg remaining_codex "$remaining_codex" --arg settings_url "https://github.com/LauraMardones/headless-pr-workflow/settings/variables/actions" '{remaining_haiku: $remaining_haiku, remaining_sonnet: $remaining_sonnet, remaining_opus: $remaining_opus, remaining_codex: $remaining_codex, settings_url: $settings_url}')
          bash scripts/slack-notify.sh budget_cap_reached "$context_json"
